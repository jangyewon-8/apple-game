<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🍎 사과 잡기 게임</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(skyblue, white);
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 10px;
    }

    #score {
      font-size: 24px;
      margin-bottom: 10px;
    }

    #basket {
      width: 100px;
      height: 30px;
      background: saddlebrown;
      border-radius: 10px;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
    }

    .apple {
      width: 40px;
      height: 40px;
      background: red;
      border-radius: 50%;
      position: absolute;
      top: 0;
    }
  </style>
</head>

<body>

  <h1>🍎 사과 잡기 게임</h1>
  <div id="score">점수: 0</div>

  <div id="basket"></div>

  <script>
    const basket = document.getElementById("basket");
    const scoreText = document.getElementById("score");

    let basketX = window.innerWidth / 2;
    let score = 0;

    // 바구니 이동
    document.addEventListener("mousemove", (e) => {
      basketX = e.clientX;
      basket.style.left = basketX + "px";
    });

    // 사과 생성
    function createApple() {
      const apple = document.createElement("div");
      apple.classList.add("apple");

      let x = Math.random() * (window.innerWidth - 40);
      let y = 0;

      apple.style.left = x + "px";
      apple.style.top = y + "px";

      document.body.appendChild(apple);

      const fall = setInterval(() => {
        y += 5;
        apple.style.top = y + "px";

        // 충돌 판정
        const basketRect = basket.getBoundingClientRect();
        const appleRect = apple.getBoundingClientRect();

        if (
          appleRect.bottom >= basketRect.top &&
          appleRect.left < basketRect.right &&
          appleRect.right > basketRect.left
        ) {
          score++;
          scoreText.innerText = "점수: " + score;

          apple.remove();
          clearInterval(fall);
        }

        // 바닥 도착
        if (y > window.innerHeight) {
          apple.remove();
          clearInterval(fall);
        }

      }, 20);
    }

    // 반복 생성
    setInterval(createApple, 1000);
  </script>

</body>
</html>
